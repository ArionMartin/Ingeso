
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registro - Eventos UCN</title>

    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <main class="login-container">

        <form id="formRegistro" class="login-card">

            <img
                src="imagenes/un-ucn-escudo-full-color.png"
                alt="Logo UCN"
                class="logo"
            >

            <h1>Eventos UCN</h1>
            <h2>Crear cuenta de estudiante</h2>

            <label for="nombre">Nombre completo</label>
            <input
                type="text"
                id="nombre"
                required
                maxlength="100"
                autocomplete="name"
            >

            <label for="correo">Correo electrónico</label>
            <input
                type="email"
                id="correo"
                required
                maxlength="150"
                autocomplete="email"
                placeholder="estudiante@alumnos.ucn.cl"
            >

            <label for="contrasena">Contraseña</label>
            <input
                type="password"
                id="contrasena"
                required
                minlength="6"
                autocomplete="new-password"
            >

            <label for="confirmar">Confirmar contraseña</label>
            <input
                type="password"
                id="confirmar"
                required
                minlength="6"
                autocomplete="new-password"
            >

            <button type="submit" id="botonRegistro">
                Crear cuenta
            </button>

            <p id="mensaje" role="status" aria-live="polite"></p>

            <p style="text-align:center">
                ¿Ya tienes cuenta?
                <a href="login.html">Iniciar sesión</a>
            </p>

            <a href="index.html">Volver al inicio</a>

        </form>

    </main>

    <script src="js/registro.js" defer></script>

</body>
</html>
